<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2b1a12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="La Gran Obra">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>INCERPAZ: La Gran Obra</title>
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <div id="app">
    <div id="stage">
      <canvas id="game" width="480" height="272" aria-label="INCERPAZ: La Gran Obra"></canvas>
      <noscript>Este juego necesita JavaScript.</noscript>
    </div>
    <div id="touch" aria-hidden="true">
      <button id="btn-pause" data-act="pause" tabindex="-1">II</button>
      <div class="pad pad-left">
        <button data-act="left" class="dir" tabindex="-1">&#9664;</button>
        <button data-act="right" class="dir" tabindex="-1">&#9654;</button>
      </div>
      <div class="pad pad-right">
        <button data-act="wall" class="act small" tabindex="-1">MURO</button>
        <button data-act="brick" class="act mid" tabindex="-1">APILAR</button>
        <button data-act="jump" class="act big" tabindex="-1">SALTO</button>
      </div>
    </div>
  </div>
  <script src="config.js?v=10"></script>
  <script src="js/font.js?v=10"></script>
  <script src="js/audio.js?v=10"></script>
  <script src="js/sprites.js?v=10"></script>
  <script src="levels.js?v=10"></script>
  <script src="js/game.js?v=10"></script>
</body>
</html>
